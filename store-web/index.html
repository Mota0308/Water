<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店鋪員工系統</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft JhengHei","PingFang TC",sans-serif; }
  body { background:#f0f2f5; color:#333; font-size:15px; }
  .hidden { display:none !important; }
  .container { max-width:1000px; margin:0 auto; padding:12px; }

  .app-chrome {
    position:sticky; top:0; z-index:90;
    background:#f0f2f5;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
  }
  .topbar { background:#37474f; color:#fff; padding:10px 16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; position:relative; }
  .topbar .brand-wrap { display:flex; align-items:center; gap:10px; flex-wrap:wrap; position:relative; }
  .topbar .brand { font-weight:bold; font-size:15px; }
  .topbar .userinfo { font-size:13px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .topbar button { background:#fff; color:#37474f; border:none; padding:5px 12px; border-radius:6px; cursor:pointer; font-size:13px; }
  .mailbox-btn { display:inline-flex; align-items:center; gap:6px; background:#546e7a !important; color:#fff !important; }
  .mailbox-btn:hover { background:#607d8b !important; }
  .mailbox-badge {
    display:inline-flex; align-items:center; justify-content:center;
    min-width:18px; height:18px; padding:0 5px; border-radius:9px;
    background:#c62828; color:#fff; font-size:11px; font-weight:bold; line-height:1;
  }
  .mailbox-modal-bg {
    position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center;
    z-index:100; padding:16px;
  }
  .mailbox-modal-bg.hidden { display:none !important; }
  .mailbox-modal {
    background:#fff; color:#333; border-radius:12px; width:min(720px, 100%);
    max-height:min(85vh, 720px); display:flex; flex-direction:column;
    box-shadow:0 10px 36px rgba(0,0,0,.25); border:1px solid #dde3ea; overflow:hidden;
  }
  .mailbox-modal .mb-head {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:#f7f9fc; border-bottom:1px solid #e5e9f0;
    padding:14px 16px; font-weight:bold; color:#37474f; flex-shrink:0;
  }
  .mailbox-modal .mb-head button { background:#eceff1; color:#37474f; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px; }
  .mailbox-tabs {
    display:flex; gap:0; border-bottom:1px solid #e5e9f0; background:#fff; flex-shrink:0;
  }
  .mailbox-tabs button {
    flex:1; border:none; background:transparent; padding:10px 12px; cursor:pointer;
    font-size:13px; font-weight:600; color:#78909c; border-bottom:2px solid transparent;
  }
  .mailbox-tabs button.active { color:#1565c0; border-bottom-color:#1565c0; background:#f3f8ff; }
  #mailbox-list { overflow:auto; flex:1; min-height:120px; }
  .mailbox-row {
    border-bottom:1px solid #eee; background:#fff; cursor:pointer;
  }
  .mailbox-row.unread { background:#f3f8ff; }
  .mailbox-row:hover { background:#eef6ff; }
  .mailbox-row-main {
    display:block; padding:10px 14px;
  }
  .mailbox-row-line {
    display:flex; flex-wrap:nowrap; align-items:center; gap:8px; min-width:0; overflow:hidden;
    font-size:13px; color:#455a64;
  }
  .mailbox-row-line .mb-status {
    flex:0 0 auto; font-size:11px; font-weight:bold; padding:2px 7px; border-radius:4px;
    line-height:1.3;
  }
  .mailbox-row.unread .mb-status { background:#bbdefb; color:#0d47a1; }
  .mailbox-row:not(.unread) .mb-status { background:#eceff1; color:#607d8b; }
  .mailbox-row-line .mb-status.mb-receipt { background:#e8f5e9; color:#2e7d32; }
  .mailbox-row-line .mb-date { flex:0 0 auto; color:#78909c; font-size:12px; white-space:nowrap; }
  .mailbox-row-line .mb-title {
    flex:1 1 auto; min-width:0; font-weight:bold; color:#37474f; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .mailbox-row-line .mb-from { flex:0 1 auto; color:#90a4ae; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px; }
  .mailbox-empty { padding:28px 16px; color:#888; font-size:13px; text-align:center; }
  .md-receipts { margin-top:14px; border-top:1px dashed #e0e6ed; padding-top:12px; }
  .md-receipts h4 { margin:0 0 8px; font-size:13px; color:#37474f; }
  .md-receipts .md-receipt-summary { font-size:12px; color:#546e7a; margin-bottom:10px; }
  .md-receipts ul { margin:0 0 10px; padding-left:18px; font-size:13px; color:#455a64; line-height:1.55; }
  .md-receipts .md-receipt-empty { font-size:12px; color:#90a4ae; margin:0 0 10px; }
  .mailbox-detail-bg {
    position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center;
    z-index:110; padding:16px;
  }
  .mailbox-detail-bg.hidden { display:none !important; }
  .mailbox-detail {
    background:#fff; color:#333; border-radius:12px; width:min(560px, 100%);
    max-height:min(80vh, 640px); display:flex; flex-direction:column;
    box-shadow:0 12px 40px rgba(0,0,0,.28); border:1px solid #dde3ea; overflow:hidden;
  }
  .mailbox-detail .md-head {
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    background:#f7f9fc; border-bottom:1px solid #e5e9f0; padding:14px 16px; flex-shrink:0;
  }
  .mailbox-detail .md-head h3 { margin:0; font-size:16px; color:#37474f; line-height:1.4; }
  .mailbox-detail .md-head button { background:#eceff1; color:#37474f; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px; flex-shrink:0; }
  .mailbox-detail .md-body { padding:14px 16px; overflow:auto; flex:1; min-height:80px; }
  .mailbox-detail .md-meta { font-size:12px; color:#78909c; margin-bottom:10px; line-height:1.5; }
  .mailbox-detail .md-content { font-size:14px; white-space:pre-wrap; color:#37474f; line-height:1.55; }
  .mailbox-detail .md-foot {
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    border-top:1px solid #e5e9f0; padding:12px 16px; background:#fafbfc; flex-shrink:0;
  }
  .mailbox-detail .md-foot-left { display:flex; gap:8px; flex-wrap:wrap; align-items:center; flex:1; min-width:0; }
  .mailbox-detail .md-read-toggle {
    margin-left:auto; border:none; border-radius:6px; padding:8px 16px; cursor:pointer;
    font-size:13px; font-weight:bold; min-width:72px;
  }
  .mailbox-detail .md-read-toggle.is-unread { background:#bbdefb; color:#0d47a1; }
  .mailbox-detail .md-read-toggle.is-read { background:#eceff1; color:#546e7a; }
  .mailbox-detail .md-read-toggle:hover { filter:brightness(.96); }
  .inv-low { color:#c62828; font-weight:bold; }
  .inv-ok { color:#263238; }
  tr.inv-row { cursor:pointer; }
  tr.inv-row:hover { background:#e3f2fd; }
  .tf-status-pending { color:#ef6c00; font-weight:bold; }
  .tf-status-approved { color:#2e7d32; font-weight:bold; }
  .tf-status-rejected { color:#c62828; font-weight:bold; }
  .tf-logs { margin:8px 0 0; padding-left:18px; font-size:12px; color:#546e7a; line-height:1.55; }
  .mailbox-transfer-actions { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  .inv-ok { color:#37474f; }
  .tag.n-cat{background:#e3f2fd;color:#1565c0}
  .tag.n-pri-normal{background:#eceff1;color:#546e7a}
  .tag.n-pri-important{background:#fff3e0;color:#ef6c00}
  .tag.n-pri-urgent{background:#ffebee;color:#c62828}
  .recipient-box {
    border:1px solid #ccd4de; border-radius:8px; padding:10px; max-height:220px; overflow:auto; background:#fafbfc;
  }
  .recipient-box .rc-tools { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .recipient-box label.rc-item {
    display:flex; align-items:center; gap:8px; margin:0; padding:6px 4px; font-size:13px; color:#333; cursor:pointer;
  }
  .recipient-box label.rc-item input { width:auto; }

  .module-nav { display:flex; gap:6px; background:#eceff1; padding:8px 12px; overflow-x:auto; border-bottom:1px solid #ddd; }
  .module-nav button { border:none; background:#fff; padding:8px 14px; border-radius:20px; cursor:pointer; white-space:nowrap; font-size:14px; font-weight:600; color:#37474f; }
  .module-nav button.active { background:#37474f; color:#fff; }
  .nav { display:flex; gap:6px; background:#fff; padding:8px 12px; overflow-x:auto; border-bottom:1px solid #ddd; }
  .nav button { border:none; background:#eef2f7; padding:8px 14px; border-radius:20px; cursor:pointer; white-space:nowrap; font-size:14px; }
  .nav button.active { background:#37474f; color:#fff; }

  .card { background:#fff; border-radius:10px; padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size:17px; margin-bottom:12px; color:#37474f; }
  .card h3 { font-size:15px; margin:12px 0 8px; color:#455a64; }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:10px; }
  .stat { background:#f7f9fc; border-radius:8px; padding:12px; text-align:center; }
  .stat .num { font-size:24px; font-weight:bold; }
  .stat .lbl { font-size:12px; color:#777; margin-top:2px; }
  .num.green{color:#2e7d32}.num.red{color:#c62828}.num.orange{color:#ef6c00}.num.blue{color:#1565c0}.num.purple{color:#7b1fa2}

  .pbar { background:#e5e9f0; border-radius:10px; height:12px; overflow:hidden; margin-top:6px; }
  .pbar > div { height:100%; background:#2e7d32; border-radius:10px; min-width:2px; transition:width .3s; }

  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:bold; white-space:nowrap; }
  .tag.s-notstart{background:#eceff1;color:#666} .tag.s-pending{background:#e3f2fd;color:#1565c0}
  .tag.s-doing{background:#e1f5fe;color:#0277bd} .tag.s-wait{background:#fff8e1;color:#8d6e00}
  .tag.s-fix{background:#fff3e0;color:#ef6c00} .tag.s-return{background:#ffebee;color:#c62828}
  .tag.s-done{background:#e8f5e9;color:#2e7d32} .tag.s-overdue{background:#ffebee;color:#c62828}
  .tag.s-skip{background:#f3e5f5;color:#7b1fa2} .tag.s-na{background:#f5f5f5;color:#aaa}
  .tag.s-pause{background:#fff8e1;color:#f57f17} .tag.s-cancel{background:#eceff1;color:#546e7a}
  .tag.s-archive{background:#efebe9;color:#5d4037}
  .tag.t-dev{background:#e8eaf6;color:#3949ab} .tag.t-rep{background:#e0f2f1;color:#00796b}
  .tag.dept{background:#f0f4f9;color:#546e7a}

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:9px 8px; border-bottom:1px solid #eee; text-align:left; vertical-align:middle; }
  th { background:#f7f9fc; color:#555; font-size:12px; }
  .table-wrap { overflow-x:auto; }
  tr.clickable { cursor:pointer; }
  tr.clickable:hover { background:#f5f8fc; }

  label { display:block; font-size:13px; color:#555; margin:10px 0 4px; }
  input[type=text],input[type=password],input[type=date],select,textarea {
    width:100%; padding:9px 10px; border:1px solid #ccd4de; border-radius:6px; font-size:14px; }
  textarea { resize:vertical; min-height:70px; }
  .btn { background:#37474f; color:#fff; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-size:14px; margin-top:12px; }
  .btn.sm { padding:5px 12px; font-size:12px; margin-top:0; }
  .btn.green{background:#2e7d32} .btn.warn{background:#ef6c00} .btn.red{background:#c62828}
  .btn.gray{background:#78909c} .btn.purple{background:#7b1fa2}

  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .filters select, .filters input { width:auto; min-width:120px; font-size:13px; padding:7px 8px; }

  /* 項目圖示縮圖 */
  .thumb { width:44px; height:44px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:22px; background:#eef2f7; overflow:hidden; padding:0; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }

  /* 階段流程 */
  .stage { border:1px solid #e5e9f0; border-radius:10px; margin-bottom:10px; overflow:hidden; }
  .stage-head { display:flex; align-items:center; gap:10px; padding:12px; cursor:pointer; flex-wrap:wrap; }
  .stage-head:hover { background:#f7f9fc; }
  .stage-num { width:28px; height:28px; min-width:28px; border-radius:50%; background:#eceff1; color:#666; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:13px; }
  .stage-num.done { background:#2e7d32; color:#fff; }
  .stage-num.current { background:#1565c0; color:#fff; }
  .stage-name { font-weight:bold; flex:1; min-width:120px; }
  .stage-body { padding:0 14px 14px 52px; font-size:13px; }
  .stage-body .row { margin-bottom:5px; color:#555; }
  .stage.current-stage { border-color:#1565c0; box-shadow:0 0 0 1px #1565c0 inset; }
  .actions-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }

  /* 留言板 */
  .msg { border:1px solid #e5e9f0; border-radius:10px; padding:12px; margin-bottom:10px; background:#fff; }
  .msg .mhead { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px; }
  .msg .mname { font-weight:bold; color:#37474f; }
  .msg .mtime { color:#999; font-size:12px; }
  .msg .mbody { margin-top:6px; font-size:14px; white-space:pre-wrap; }
  .msg .mbody .mention { color:#1565c0; font-weight:bold; }
  .msg .mfile { margin-top:6px; font-size:12px; color:#7b1fa2; }
  .msg .reply { margin-top:8px; margin-left:16px; border-left:3px solid #e5e9f0; padding-left:10px; }
  .msg .removed { color:#aaa; font-style:italic; }

  /* 分頁 */
  .tabs { display:flex; gap:4px; border-bottom:2px solid #e5e9f0; margin-bottom:14px; overflow-x:auto; }
  .tabs button { border:none; background:none; padding:9px 14px; cursor:pointer; font-size:14px; color:#666; white-space:nowrap; border-bottom:3px solid transparent; }
  .tabs button.active { color:#37474f; font-weight:bold; border-bottom-color:#37474f; }

  /* 登入 */
  .login-wrap { max-width:400px; margin:40px auto; padding:0 16px; }
  .login-card { background:#fff; border-radius:12px; padding:28px 24px; box-shadow:0 2px 10px rgba(0,0,0,.1); }
  .login-card h1 { font-size:18px; color:#37474f; text-align:center; margin-bottom:4px; }
  .login-card .sub { text-align:center; color:#888; font-size:12px; margin-bottom:16px; }
  .login-err { color:#c62828; font-size:13px; margin-top:8px; display:none; }
  .login-hint { margin-top:16px; font-size:12px; color:#666; background:#f7f9fc; border-radius:8px; padding:12px; }
  .login-hint b { color:#37474f; }
  .login-hint div { padding:2px 0; }

  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:99; padding:16px; }
  .modal { background:#fff; border-radius:12px; padding:22px; max-width:420px; width:100%; max-height:85vh; overflow-y:auto; }
  .modal h3 { margin-bottom:10px; color:#37474f; }
  .modal .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }

  .file-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid #e5e9f0; border-radius:8px; margin-bottom:6px; font-size:13px; flex-wrap:wrap; }
  .file-item .fname { font-weight:bold; }
  .file-item .fmeta { color:#888; font-size:12px; }
  .latest-badge { background:#2e7d32; color:#fff; font-size:10px; padding:1px 6px; border-radius:8px; }
  a.file-link { color:#7b1fa2; font-weight:bold; text-decoration:underline; cursor:pointer; }
  a.file-link:hover { color:#4a148c; }
  .msg .mfile a.file-link { color:#7b1fa2; }

  .mention-wrap { position:relative; }
  .mention-box {
    display:none; position:absolute; left:0; right:0; top:100%; z-index:20;
    background:#fff; border:1px solid #ccd4de; border-radius:8px;
    box-shadow:0 4px 14px rgba(0,0,0,.12); max-height:180px; overflow:auto; margin-top:4px;
  }
  .mention-box.show { display:block; }
  .mention-item {
    display:block; width:100%; text-align:left; border:none; background:#fff;
    padding:8px 12px; cursor:pointer; font-size:13px; color:#333;
  }
  .mention-item:hover, .mention-item.active { background:#eef2f7; }
  .mention-item .mid { color:#888; font-size:12px; margin-left:6px; }

  .info-banner { background:#e3f2fd; border:1px solid #90caf9; color:#0d47a1; padding:10px 14px; border-radius:8px; margin-bottom:12px; font-size:13px; }
  .app-update-banner {
    position:fixed; left:12px; right:12px; bottom:12px; z-index:200;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px;
    background:#1b5e20; color:#fff; padding:12px 16px; border-radius:10px;
    box-shadow:0 8px 28px rgba(0,0,0,.28); font-size:14px;
  }
  .app-update-banner.hidden { display:none !important; }
  .app-update-banner .aub-msg { flex:1 1 200px; line-height:1.45; }
  .app-update-banner .aub-actions { display:flex; gap:8px; flex-shrink:0; }
  .app-update-banner button {
    border:none; border-radius:6px; padding:8px 14px; cursor:pointer; font-size:13px; font-weight:bold;
  }
  .app-update-banner .aub-update { background:#fff; color:#1b5e20; }
  .app-update-banner .aub-later { background:rgba(255,255,255,.18); color:#fff; }
  @media (max-width:600px){ body{font-size:14px} .stat .num{font-size:20px} .stage-body{padding-left:14px} }
</style>
</head>
<body>

<!-- ═══════════ 登入頁 ═══════════ -->
<div id="page-login" class="login-wrap">
  <div class="login-card">
    <h1>🏭 店鋪員工系統</h1>
    <div class="sub">每日工作流程 · 開發及生產 · 補貨</div>
    <label>登入名稱</label>
    <input type="text" id="login-user" placeholder="電話號碼（或舊賬號／admin）" autocomplete="username">
    <label>密碼</label>
    <input type="password" id="login-pw" placeholder="請輸入密碼">
    <div class="login-err" id="login-err"></div>
    <button class="btn" style="width:100%" id="btn-login">登入</button>
    <div class="login-hint">
      <b>預設賬號：</b>
      <div>系統管理員：admin / admin</div>
      <div style="margin-top:6px;color:#666">其他員工請由管理員以「創建員工」新增；初始密碼為賬號最後四位。</div>
      <div style="margin-top:8px;color:#1565c0">資料保存在 MongoDB 雲端：任何裝置開啟同一網站即可登入與輸入。</div>
    </div>
  </div>
</div>

<!-- ═══════════ 主系統 ═══════════ -->
<div id="app" class="hidden">
  <div class="app-chrome">
    <div class="topbar">
      <div class="brand-wrap">
        <div class="brand">🏭 店鋪員工系統</div>
        <button type="button" class="mailbox-btn" id="mailbox-btn" >信箱通知<span id="mailbox-badge" class="mailbox-badge hidden">0</span></button>
      </div>
      <div class="userinfo"><span id="cloud-sync-status" style="font-size:12px;opacity:.9"></span><span id="top-user"></span><button type="button" id="btn-logout">登出</button></div>
    </div>
    <div class="module-nav" id="module-nav"></div>
    <div class="nav" id="nav"></div>
  </div>
  <div class="container" id="main"></div>
</div>

<div id="modal-bg" class="modal-bg hidden"><div class="modal" id="modal-content"></div></div>
<div id="mailbox-modal-bg" class="mailbox-modal-bg hidden" >
  <div class="mailbox-modal" id="mailbox-modal-panel">
    <div class="mb-head">
      <span>信箱通知</span>
      <button type="button" data-action="close-mailbox">關閉</button>
    </div>
    <div class="mailbox-tabs">
      <button type="button" id="mailbox-tab-inbox" class="active" data-action="tab-inbox">接收</button>
      <button type="button" id="mailbox-tab-sent" data-action="tab-sent">發送</button>
    </div>
    <div id="mailbox-list"><p class="mailbox-empty">登入後可查看通知。</p></div>
  </div>
</div>
<div id="mailbox-detail-bg" class="mailbox-detail-bg hidden" >
  <div class="mailbox-detail" id="mailbox-detail-panel">
    <div class="md-head">
      <h3 id="mailbox-detail-title">通知</h3>
      <button type="button" data-action="close-mailbox-detail">關閉</button>
    </div>
    <div class="md-body" id="mailbox-detail-body"></div>
    <div class="md-foot">
      <div class="md-foot-left" id="mailbox-detail-actions"></div>
      <button type="button" class="md-read-toggle is-unread" id="mailbox-detail-read-btn" data-action="toggle-read">未讀</button>
    </div>
  </div>
</div>
<div id="app-update-banner" class="app-update-banner hidden" role="status" aria-live="polite">
  <div class="aub-msg">系統有新程式／功能可用。請更新以載入最新版本。</div>
  <div class="aub-actions">
    <button type="button" class="aub-later" data-action="dismiss-update">稍後</button>
    <button type="button" class="aub-update" data-action="apply-update">更新系統</button>
  </div>
</div>

<script>
(function () {
  function loadApp(v) {
    var s = document.createElement('script');
    s.src = '/app.js?v=' + encodeURIComponent(v || String(Date.now()));
    s.defer = true;
    s.onerror = function () {
      var err = document.getElementById('login-err');
      if (err) {
        err.style.display = 'block';
        err.textContent = '載入應用程式失敗，請強制重新整理。';
      }
      console.error('Failed to load /app.js');
    };
    document.body.appendChild(s);
  }
  fetch('/api/version', { cache: 'no-store', credentials: 'include' })
    .then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (info) { loadApp(info && info.version); })
    .catch(function () { loadApp(); });
})();
</script>
</body>
</html>
